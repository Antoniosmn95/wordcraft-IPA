name: WordCraft
options:
  bundleIdPrefix: ai.storyteller
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_C_LANGUAGE_STANDARD: gnu17
    SWIFT_OBJC_BRIDGING_HEADER: App/Sources/WordCraft-Bridging-Header.h
    PRODUCT_BUNDLE_IDENTIFIER: ai.storyteller.wordcraft
    PRODUCT_NAME: WordCraft
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../target/aarch64-apple-ios/release"
    OTHER_LDFLAGS: "$(inherited) -lwordcraft_ios -lc++ -lz -liconv -framework Security -framework Metal -framework MetalKit -framework QuartzCore -framework CoreGraphics -framework CoreText -framework CoreFoundation -framework UIKit -framework Foundation -framework ImageIO -framework UniformTypeIdentifiers -framework CoreServices"
targets:
  WordCraft:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WordCraft
        CFBundleShortVersionString: "0.18.1"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Word Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.wordprocessingml.template
              - com.microsoft.word.doc
              - org.oasis-open.opendocument.text
              - org.oasis-open.opendocument.text-template
              - public.rtf
              - net.daringfireball.markdown
              - public.plain-text
              - public.html
          - CFBundleTypeName: Picture
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  WordCraft:
    build:
      targets:
        WordCraft: all
    run:
      config: Debug
    archive:
      config: Release
